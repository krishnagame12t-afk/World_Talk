  <script>
    const localPreview=new URLSearchParams(window.location.search).get('preview')==='1';
    if(!localPreview)document.documentElement.classList.add('auth-checking');
    const authStorageKey='worldtalk-auth-session';
    const authConfig=window.WORLDTALK_CONFIG||{};
    const goToSignIn=(reason='')=>{sessionStorage.removeItem(authStorageKey);window.location.replace(`index.html?signin=required${reason?'&reason='+reason:''}`)};
    async function validateWorldTalkSession(){
      let session;
      try{session=JSON.parse(sessionStorage.getItem(authStorageKey)||'null')}catch{}
      if(!authConfig.supabaseUrl||!authConfig.publishableKey||!session?.access_token){goToSignIn();return}
      const base=authConfig.supabaseUrl.replace(/\/$/,'');
      const getUser=token=>fetch(`${base}/auth/v1/user`,{headers:{apikey:authConfig.publishableKey,Authorization:`Bearer ${token}`}});
      try{
        let response=await getUser(session.access_token);
        if(!response.ok&&session.refresh_token){
          const refreshed=await fetch(`${base}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:authConfig.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
          if(refreshed.ok){const next=await refreshed.json();session={...session,...next,expires_at:next.expires_at||Math.floor(Date.now()/1000)+(next.expires_in||3600)};sessionStorage.setItem(authStorageKey,JSON.stringify(session));response=await getUser(session.access_token)}
        }
        if(!response.ok){goToSignIn();return}
        const user=await response.json();
        if(!user.email_confirmed_at||!user.phone_confirmed_at){goToSignIn('verification');return}
        window.WORLDTALK_AUTH_SESSION=session;
        document.documentElement.classList.remove('auth-checking');
      }catch{goToSignIn()}
    }
    if(!localPreview)validateWorldTalkSession();
  </script>
  <style>
    :root{color-scheme:light;--ink:#182520;--muted:#75827c;--line:#e7ebe8;--paper:#fff;--wash:#f5f7f5;--green:#16845f;--pale:#e5f5ec;--soft:#f1f6f2}
    *{box-sizing:border-box}html.auth-checking body{visibility:hidden}body{margin:0;background:var(--wash);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
    .demo-note{height:34px;display:flex;align-items:center;justify-content:center;background:#eaf5ee;color:#28644d;font-size:12px;font-weight:650;letter-spacing:.1px;padding:0 12px;text-align:center}
    .app{height:calc(100dvh - 34px);max-width:1440px;min-height:540px;margin:auto;background:var(--paper);display:grid;grid-template-columns:370px minmax(0,1fr);box-shadow:0 12px 55px #23372d12;overflow:hidden}
    .side{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;background:#fff}.side-head{padding:21px 20px 13px}.brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:780;letter-spacing:-.5px}.brand-mark{height:34px;width:34px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:17px;font-weight:800}.back-home{font-size:12px;color:var(--muted);text-decoration:none}.back-home:hover{color:var(--green)}
    .search{height:43px;border:1px solid var(--line);border-radius:13px;background:#fafbfa;display:flex;align-items:center;gap:9px;padding:0 12px;color:#85918a}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);font-size:13px}.search:focus-within{border-color:#83bfa5;box-shadow:0 0 0 3px #e5f5ec}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:15px;border-bottom:1px solid var(--line)}.tab{position:relative;border:0;background:transparent;color:var(--muted);padding:13px 6px 12px;font-size:13px;font-weight:700}.tab.active{color:var(--green)}.tab.active:after{content:"";position:absolute;bottom:-1px;left:20%;right:20%;height:3px;border-radius:5px 5px 0 0;background:var(--green)}.section-label{padding:14px 20px 8px;color:#96a19a;font-size:10px;letter-spacing:1.3px;font-weight:750;text-transform:uppercase}.list{overflow:auto;flex:1;padding:0 8px 75px}.item{width:100%;min-height:76px;padding:11px 12px;border:0;border-radius:13px;background:transparent;display:flex;gap:11px;align-items:center;text-align:left;color:inherit}.item:hover{background:#f6f8f6}.item.selected{background:#edf6f0}.avatar{height:46px;width:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:#dceee4;color:#27694e;font-weight:750;font-size:13px;position:relative}.avatar.coral{background:#fae8dc;color:#8b583d}.avatar.blue{background:#e2ecf8;color:#476b9d}.avatar.gold{background:#f8f0d9;color:#85703b}.avatar.purple{background:#eee7f7;color:#6f5792}.avatar.group{border-radius:16px;background:#e6f0eb}.presence{position:absolute;width:11px;height:11px;border:2px solid white;border-radius:50%;background:#43b77a;right:0;bottom:0}.item-main{min-width:0;flex:1}.item-top,.item-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.item-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#89958e;font-size:10px;white-space:nowrap}.preview{margin-top:5px;color:#849089;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{min-width:18px;height:18px;border-radius:10px;background:var(--green);color:white;font-size:10px;display:grid;place-items:center;padding:0 5px;font-weight:700}.empty-list{padding:32px 14px;color:var(--muted);text-align:center;line-height:1.5;font-size:12px}.new-chat{position:absolute;right:19px;bottom:20px;width:54px;height:54px;border:0;border-radius:18px;background:var(--green);color:white;font-size:28px;box-shadow:0 8px 20px #16845f40}.new-chat:hover{transform:translateY(-2px);background:#116e4e}
    .conversation{min-width:0;display:flex;flex-direction:column;background:#fbfcfb}.chat-head{height:76px;background:#fff;border-bottom:1px solid var(--line);padding:0 25px;display:flex;align-items:center;gap:12px}.chat-head .avatar{height:42px;width:42px}.head-info{min-width:0;flex:1}.head-name{font-weight:750;font-size:14px}.head-status{margin-top:4px;color:var(--muted);font-size:11px}.lang-pill{font-size:10px;color:#39745b;background:#edf6f0;border-radius:20px;padding:6px 9px;white-space:nowrap}.mobile-back{display:none;border:0;background:transparent;font-size:20px;color:var(--green)}
    .messages{flex:1;overflow:auto;padding:26px clamp(18px,5vw,72px);display:flex;flex-direction:column;gap:13px;background-color:#fafbf9;background-image:radial-gradient(#dce6df 0.7px,transparent .7px);background-size:20px 20px}.day{text-align:center;color:#78857e;font-size:10px;margin:2px 0 6px}.msg{max-width:min(76%,540px);padding:11px 13px 9px;border-radius:15px 15px 15px 4px;background:white;box-shadow:0 2px 7px #172a1f0b;align-self:flex-start;border:1px solid #edf0ed}.msg.mine{align-self:flex-end;background:#e7f5eb;border-color:#dfefe4;border-radius:15px 15px 4px 15px}.msg-text{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.translation{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.original{padding-top:7px;margin-top:7px;border-top:1px solid #e8ece9;color:#7c8982;font-size:11px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.translate-label{font-size:9px;color:#6e8177;margin-top:7px;display:flex;gap:5px;align-items:center}.msg-meta{margin-top:6px;color:#829088;text-align:right;font-size:9px}.demo-translation{color:#9b6a28;font-style:italic}
    .composer-wrap{padding:13px 22px 17px;background:#fff;border-top:1px solid var(--line)}.composer-note{font-size:10px;color:#849189;text-align:center;margin:0 0 9px}.composer{display:flex;align-items:flex-end;gap:9px;padding:7px 8px 7px 14px;border:1px solid #e3e9e4;border-radius:16px;background:#fff;box-shadow:0 3px 12px #1a30240a}.composer textarea{min-height:40px;max-height:108px;resize:none;flex:1;border:0;outline:none;padding:10px 0;color:var(--ink);font-size:13px}.send{height:40px;width:42px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:17px}.send:disabled{opacity:.45;cursor:default}.target-select{border:0;background:transparent;color:#718078;font-size:10px;max-width:150px;outline:0}
    .modal-backdrop{position:fixed;inset:0;background:#14231d66;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(410px,100%);max-height:min(600px,90dvh);border-radius:20px;background:white;box-shadow:0 24px 70px #0003;overflow:hidden;display:flex;flex-direction:column}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head strong{font-size:16px}.close{border:0;background:#f1f4f1;width:32px;height:32px;border-radius:50%;color:#68756e;font-size:19px}.contact-search{margin:13px 16px}.contacts{overflow:auto;padding:0 9px 10px}.contact{width:100%;border:0;background:white;display:flex;align-items:center;gap:11px;text-align:left;padding:10px;border-radius:12px;color:var(--ink)}.contact:hover{background:#f4f7f4}.contact small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1d3429;color:#fff;border-radius:12px;padding:11px 15px;font-size:12px;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{height:calc(100dvh - 34px);min-height:0;grid-template-columns:1fr}.side{border:0}.conversation{display:none}.app.in-chat .side{display:none}.app.in-chat .conversation{display:flex}.chat-head{height:67px;padding:0 14px}.mobile-back{display:block}.lang-pill{max-width:125px;overflow:hidden;text-overflow:ellipsis}.messages{padding:20px 14px}.msg{max-width:88%}.composer-wrap{padding:10px 12px 13px}.side-head{padding:16px 16px 10px}}
    @media(min-width:761px){.conversation{display:flex!important}}
    .lang-control{display:flex;align-items:center;gap:6px;color:#39745b;background:#edf6f0;border-radius:20px;padding:5px 9px;white-space:nowrap;font-size:10px}.lang-control input{width:112px;border:0;outline:0;background:transparent;color:#28644d;font:inherit;font-weight:700}.lang-control input::placeholder{color:#28644d;opacity:.75}
    .back-home{border:0;background:transparent;font:inherit;cursor:pointer}
    .back-home{border:0;background:transparent;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <div class="demo-note" id="demoNote">LOCAL DEMO · Messages stay in this browser. No real messages or live translations are sent.</div>
  <div class="app" id="app">
    <aside class="side" aria-label="Chats and groups">
      <div class="side-head">
        <div class="brand-row"><div class="brand"><span class="brand-mark">W</span>WorldTalk</div><button class="back-home" id="welcomeAction" type="button">Welcome</button></div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="chatSearch" type="search" placeholder="Search contacts or chats" autocomplete="off"></label>
        <div class="tabs" role="tablist"><button class="tab active" id="chatsTab" role="tab" aria-selected="true">Chats</button><button class="tab" id="groupsTab" role="tab" aria-selected="false">Groups</button></div>
      </div>
      <div class="section-label" id="listLabel">Recent chats</div>
      <div class="list" id="chatList"></div>
      <button class="new-chat" id="newChat" aria-label="Start a new chat" title="Start a new chat">＋</button>
    </aside>
    <main class="conversation" aria-label="Conversation">
      <header class="chat-head">
        <button class="mobile-back" id="mobileBack" aria-label="Back to chats">‹</button>
        <div class="avatar" id="activeAvatar">AY</div>
        <div class="head-info"><div class="head-name" id="activeName">Amina Yusuf</div><div class="head-status" id="activeStatus">online · prefers Arabic</div></div>
        <label class="lang-control">Translate to <input id="viewLanguage" list="worldLanguages" value="English" aria-label="Choose or type the language you want to read messages in" autocomplete="off"><datalist id="worldLanguages"></datalist></label>
      </header>
      <section class="messages" id="messages" aria-live="polite"></section>
      <form class="composer-wrap" id="composerForm">
        <p class="composer-note">Demo only: translation is shown for sample messages; new messages are not translated live.</p>
        <div class="composer"><textarea id="messageInput" rows="1" maxlength="2000" placeholder="Write a message…" aria-label="Write a message"></textarea><button class="send" id="sendButton" type="submit" aria-label="Send message">↑</button></div>
      </form>
    </main>
  </div>
  <div class="modal-backdrop" id="newChatModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal"><div class="modal-head"><strong id="modalTitle">Start a new chat</strong><button class="close" id="closeModal" aria-label="Close">×</button></div><label class="search contact-search"><span aria-hidden="true">⌕</span><input id="contactSearch" type="search" placeholder="Search WorldTalk friends" autocomplete="off"></label><div class="contacts" id="contactList"></div></section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const starterChats = [
      {id:'amina',name:'Amina Yusuf',initials:'AY',language:'Arabic',avatar:'',online:true,kind:'direct',time:'10:42',unread:2,preview:'The translation appears below the original.',messages:[
        {from:'them',text:'صباح الخير! كيف حالك؟',translation:'Good morning! How are you?',lang:'Arabic',time:'10:38'},
        {from:'me',text:'Good morning! I’m doing well, thank you.',translation:'صباح الخير! أنا بخير، شكرًا لك.',lang:'Arabic',time:'10:40'},
        {from:'them',text:'هل نلتقي لتناول القهوة هذا الأسبوع؟',translation:'Shall we meet for coffee this week?',lang:'Arabic',time:'10:42'}]},
      {id:'mateo',name:'Mateo García',initials:'MG',language:'Spanish',avatar:'coral',online:false,kind:'direct',time:'Yesterday',unread:0,preview:'That sounds like a great plan!',messages:[
        {from:'them',text:'¡Hola! ¿Cómo estuvo tu día?',translation:'Hi! How was your day?',lang:'Spanish',time:'Yesterday'},
        {from:'me',text:'It was good. I went for a walk.',translation:'Estuvo bien. Fui a dar un paseo.',lang:'Spanish',time:'Yesterday'}]},
      {id:'priya',name:'Priya Shah',initials:'PS',language:'Hindi',avatar:'blue',online:true,kind:'direct',time:'Mon',unread:0,preview:'मैं शाम को फोन करूंगी।',messages:[
        {from:'them',text:'मैं शाम को फोन करूंगी।',translation:'I’ll call in the evening.',lang:'Hindi',time:'Mon'},
        {from:'me',text:'Perfect, talk to you then!',translation:'बिल्कुल, तब बात करते हैं!',lang:'Hindi',time:'Mon'}]},
      {id:'family',name:'Family group',initials:'FG',language:'Hindi',avatar:'group',online:false,kind:'group',time:'09:15',unread:4,preview:'Ravi: See you all on Sunday!',members:'5 members',messages:[
        {from:'them',name:'Ravi',text:'See you all on Sunday!',translation:'आप सभी से रविवार को मिलते हैं!',lang:'Hindi',time:'09:15'}]},
      {id:'language-club',name:'Language exchange',initials:'LE',language:'Spanish',avatar:'purple',online:false,kind:'group',time:'Tue',unread:0,preview:'Sofia: Welcome, everyone!',members:'8 members',messages:[
        {from:'them',name:'Sofia',text:'Welcome, everyone!',translation:'¡Bienvenidos a todos!',lang:'Spanish',time:'Tue'}]}
    ];
    const contacts=[{id:'amina',name:'Amina Yusuf',initials:'AY',language:'Arabic',avatar:'',kind:'direct',online:true},{id:'mateo',name:'Mateo García',initials:'MG',language:'Spanish',avatar:'coral',kind:'direct'},{id:'priya',name:'Priya Shah',initials:'PS',language:'Hindi',avatar:'blue',kind:'direct',online:true},{id:'luca',name:'Luca Moretti',initials:'LM',language:'Italian',avatar:'gold',kind:'direct'},{id:'mei',name:'Mei Chen',initials:'MC',language:'Chinese',avatar:'purple',kind:'direct'}];
    const storageKey='worldtalk.local-chat-demo.v1';
    let chats=loadChats();let selectedId=chats.find(c=>c.kind==='direct')?.id||chats[0]?.id;let activeTab='chats';let viewLanguage=localStorage.getItem('worldtalk-view-language')||'English';
    const languageCodes='aa ab ae af ak am an ar as av ay az ba be bg bh bi bm bn bo br bs ca ce ch co cr cs cu cv cy da de dv dz ee el en eo es et eu fa ff fi fj fo fr fy ga gd gl gn gu gv ha he hi ho hr ht hu hy hz ia id ie ig ii ik io is iu ja jv ka kg ki kj kk kl km kn ko kr ks ku kv kw ky la lb lg li ln lo lt lu lv mg mh mi mk ml mn mr ms mt my na nb nd ne ng nl nn no nr nv ny oc oj om or os pa pi pl ps pt qu rm rn ro ru rw sa sc sd se sg si sk sl sm sn so sq sr ss st su sv sw ta te tg th ti tk tl tn to tr ts tt tw ty ug uk ur uz ve vi vo wa wo xh yi yo za zh zu'.split(' ');
    const extraLanguages=['Acholi','Adangme','Afar','Akan','Aromanian','Assamese (Romanized)','Awadhi','Balinese','Balochi','Bavarian','Bemba','Bhojpuri','Bikol','Bodo','Buginese','Cebuano','Central Kurdish (Sorani)','Chavacano','Chhattisgarhi','Crimean Tatar','Dargwa','Dinka','Dogri','Dzongkha','Fang','Faroese','Fijian Hindi','Fon','Friulian','Gagauz','Ganda','Garhwali','Gilaki','Gondi','Hakka Chinese','Haryanvi','Hiligaynon','Hmong','Hunsrik','Iban','Ilocano','Javanese','Kabyle','Kachin','Kamba','Kashmiri (Arabic script)','Kashmiri (Devanagari)','Kashubian','Kikuyu','Kinyarwanda','Komi','Konkani','Krio','Kurdish (Kurmanji)','Ladino','Lao Isan','Latgalian','Limburgish','Lombard','Luganda','Maithili','Makassar','Malagasy','Maldivian','Malvi','Manipuri (Meitei)','Manx','Marathi Konkani','Marwari','Meadow Mari','Mizo','Mundari','Nahuatl','Navajo','Ndebele (Northern)','Ndebele (Southern)','Newari (Nepal Bhasa)','NKo','Nuer','Occitan','Odia (Classical)','Pangasinan','Rajasthani','Romani','Sardinian','Santali','Saterland Frisian','Sicilian','Silesian','Tachelhit','Tajik (Cyrillic)','Tajik (Arabic)','Talysh','Tamasheq','Tatar (Crimean)','Tibetan (Classical)','Tongan','Tulu','Umbundu','Venetian','Walloon','Wayuu','Wu Chinese','Yao','Yoruba (Nigerian)','Zazaki'];
    function populateLanguages(){const names=new Intl.DisplayNames(['en'],{type:'language'});const languages=new Set(extraLanguages);for(const code of languageCodes){try{languages.add(names.of(code))}catch{}}const sorted=[...languages].filter(Boolean).sort((a,b)=>a.localeCompare(b));$('worldLanguages').innerHTML=sorted.map(name=>`<option value="${escapeHtml(name)}"></option>`).join('')}
    const $=id=>document.getElementById(id);
    function loadChats(){try{const saved=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(saved)&&saved.length)return saved}catch{}return structuredClone(starterChats)}
    function save(){localStorage.setItem(storageKey,JSON.stringify(chats))}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function avatarMarkup(person){return `<div class="avatar ${person.avatar||''}">${escapeHtml(person.initials)}${person.online?'<i class="presence"></i>':''}</div>`}
    function renderList(){const query=$('chatSearch').value.trim().toLowerCase();const kind=activeTab==='groups'?'group':'direct';const results=chats.filter(c=>c.kind===kind&&`${c.name} ${c.preview} ${c.language}`.toLowerCase().includes(query));$('listLabel').textContent=activeTab==='groups'?'Your groups':'Recent chats';$('chatList').innerHTML=results.length?results.map(c=>`<button class="item ${c.id===selectedId?'selected':''}" data-chat="${escapeHtml(c.id)}">${avatarMarkup(c)}<span class="item-main"><span class="item-top"><span class="item-name">${escapeHtml(c.name)}</span><span class="time">${escapeHtml(c.time||'')}</span></span><span class="item-bottom"><span class="preview">${escapeHtml(c.preview||'Start a conversation')}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</span></span></button>`).join(''):`<div class="empty-list">${query?'No chats or contacts match your search.':'No '+(kind==='group'?'groups':'chats')+' yet. Tap ＋ to start one.'}</div>`;$('chatList').querySelectorAll('[data-chat]').forEach(b=>b.addEventListener('click',()=>selectChat(b.dataset.chat)))}
    function renderMessages(){const c=chats.find(x=>x.id===selectedId);if(!c)return;$('activeName').textContent=c.name;$('activeAvatar').textContent=c.initials;$('activeAvatar').className='avatar '+(c.avatar||'');$('activeStatus').textContent=c.kind==='group'?(c.members||'Group conversation'):`${c.online?'online':'last seen recently'} · prefers ${c.language}`;$('viewLanguage').value=viewLanguage;$('messages').innerHTML='<div class="day">Today · messages shown in your language</div>'+c.messages.map(m=>{const mine=m.from==='me';const originalLanguage=m.lang||'English';const sampleTranslation=m.translations?.[viewLanguage]||(viewLanguage===originalLanguage?m.text:(viewLanguage==='English'?m.translation:null));const displayedTranslation=sampleTranslation||(mine?'Live translation is not connected in this demo.':`Sample translation to ${viewLanguage} is not included in this demo.`);const sameAsOriginal=sampleTranslation===m.text;return `<article class="msg ${mine?'mine':''}">${!mine&&m.name?`<div class="msg-meta" style="text-align:left;margin:0 0 5px;font-weight:700">${escapeHtml(m.name)}</div>`:''}<div class="msg-text">${escapeHtml(m.text)}</div>${!sameAsOriginal?`<div class="original translation ${sampleTranslation?'':'demo-translation'}">${escapeHtml(displayedTranslation)}</div>`:''}${sameAsOriginal?`<div class="translate-label">🌐 Original · ${escapeHtml(viewLanguage)}</div>`:`<div class="translate-label">🌐 Translation · ${escapeHtml(viewLanguage)}${sampleTranslation?' · sample':''}</div>`}<div class="msg-meta">${escapeHtml(m.time||'Now')}${mine?' · Sent':''}</div></article>`}).join('');$('messages').scrollTop=$('messages').scrollHeight}
    function selectChat(id){const c=chats.find(x=>x.id===id);if(!c)return;selectedId=id;c.unread=0;renderList();renderMessages();$('app').classList.add('in-chat');$('messageInput').focus()}
    function setTab(tab){activeTab=tab;$('chatsTab').classList.toggle('active',tab==='chats');$('groupsTab').classList.toggle('active',tab==='groups');$('chatsTab').setAttribute('aria-selected',tab==='chats');$('groupsTab').setAttribute('aria-selected',tab==='groups');const first=chats.find(c=>c.kind===(tab==='groups'?'group':'direct'));if(first)selectedId=first.id;renderList();renderMessages()}
    function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
    function openContacts(){activeTab='chats';setTab('chats');$('contactSearch').value='';renderContacts();$('newChatModal').classList.add('open');$('contactSearch').focus()}
    function renderContacts(){const query=$('contactSearch').value.trim().toLowerCase();const filtered=contacts.filter(c=>`${c.name} ${c.language}`.toLowerCase().includes(query));$('contactList').innerHTML=filtered.map(c=>`<button class="contact" data-contact="${escapeHtml(c.id)}">${avatarMarkup(c)}<span><strong>${escapeHtml(c.name)}</strong><small>Prefers ${escapeHtml(c.language)}</small></span></button>`).join('')||'<div class="empty-list">No WorldTalk friends match your search.</div>'; $('contactList').querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>startChat(b.dataset.contact)))}
    function startChat(id){let c=chats.find(x=>x.id===id);if(!c){const person=contacts.find(x=>x.id===id);if(!person)return;c={...person,time:'Now',unread:0,preview:'Start a conversation',messages:[]};chats.unshift(c);save()}$('newChatModal').classList.remove('open');setTab('chats');selectChat(id)}
    function sendMessage(event){event.preventDefault();const input=$('messageInput');const text=input.value.trim();if(!text)return;const c=chats.find(x=>x.id===selectedId);if(!c)return;c.messages.push({from:'me',text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});c.preview=text;c.time='Now';save();input.value='';input.style.height='40px';renderMessages();renderList();toast('Demo message added on this device only.')}
    $('chatsTab').addEventListener('click',()=>setTab('chats'));$('groupsTab').addEventListener('click',()=>setTab('groups'));$('chatSearch').addEventListener('input',renderList);$('newChat').addEventListener('click',openContacts);$('closeModal').addEventListener('click',()=>$('newChatModal').classList.remove('open'));$('newChatModal').addEventListener('click',e=>{if(e.target===$('newChatModal'))$('newChatModal').classList.remove('open')});$('contactSearch').addEventListener('input',renderContacts);$('composerForm').addEventListener('submit',sendMessage);$('messageInput').addEventListener('input',e=>{e.target.style.height='40px';e.target.style.height=Math.min(e.target.scrollHeight,108)+'px'});$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composerForm').requestSubmit()}});$('mobileBack').addEventListener('click',()=>$('app').classList.remove('in-chat'));$('viewLanguage').addEventListener('change',e=>{const chosen=e.target.value.trim();if(!chosen){e.target.value=viewLanguage;return}viewLanguage=chosen;localStorage.setItem('worldtalk-view-language',viewLanguage);renderMessages();toast(`Your reading language is now ${viewLanguage}.`)});
    $('demoNote').textContent=localPreview?'LOCAL PREVIEW · No account needed. Chats are saved only in this browser; messages are not sent or translated live.':'SIGNED-IN PREVIEW · This chat screen still uses local demo messages; chats are not synced.';
    $('welcomeAction').textContent=localPreview?'Back to welcome':'Sign out';
    $('welcomeAction').addEventListener('click',async()=>{if(localPreview){window.location.href='index.html';return}const session=window.WORLDTALK_AUTH_SESSION;const config=window.WORLDTALK_CONFIG||{};if(session?.access_token&&config.supabaseUrl){try{await fetch(`${config.supabaseUrl.replace(/\/$/,'')}/auth/v1/logout`,{method:'POST',headers:{apikey:config.publishableKey,Authorization:`Bearer ${session.access_token}`}})}catch{}}sessionStorage.removeItem('worldtalk-auth-session');window.location.href='index.html'});
    populateLanguages();renderList();renderMessages();
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  </script>
</body>
